# ============================================================================
# Escalator Starter - Docker Compose
# ============================================================================
# Local dev:  docker compose up
# Production: Deploy to Coolify with external DB
# ============================================================================

services:
  # --------------------------------------------------------------------------
  # Application (serves both API and static files)
  # --------------------------------------------------------------------------
  app:
    build:
      context: .
      dockerfile: Dockerfile
      target: runtime
    ports:
      - "30099:30099"
    environment:
      # Database connection (use Coolify-managed DB in production)
      - DB_HOST=${DB_HOST:-localhost}
      - DB_PORT=${DB_PORT:-5432}
      - DB_USER=${DB_USER:-postgres}
      - DB_PASSWORD=${DB_PASSWORD:-changeme}
      - DB_NAME=${DB_NAME:-app_db}
      
      # Static files directory (set in Dockerfile, can override)
      - STATIC_DIR=${STATIC_DIR:-/app/public}
      
      # Authentication
      - AUTH_PEPPER=${AUTH_PEPPER:-default_pepper_change_me}
      - API_FULL_ACCESS_TOKEN=${API_FULL_ACCESS_TOKEN:-}
      
      # Session management
      - SESSION_CACHE_TYPE=${SESSION_CACHE_TYPE:-hybrid}
      
      # JVM options
      - JAVA_OPTS=${JAVA_OPTS:--Xmx512m -Xms256m}
    healthcheck:
      test: ["CMD", "curl", "-s", "-o", "/dev/null", "-w", "%{http_code}", "http://localhost:30099/"]
      interval: 30s
      timeout: 10s
      start_period: 60s
      retries: 3
    restart: unless-stopped

# For Coolify: add external network to reach Coolify-managed database
# networks:
#   default:
#   coolify:
#     external: true
