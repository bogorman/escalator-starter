include "exchanges.conf"

escalatorstarter {

  http {
    interface = "0.0.0.0"
    port = 30099
  }

  admin {
    password = "adminpass"
  }

  auth {
    pepper = "<CHANGE THIS>"
    pepper = ${?AUTH_PEPPER}

    apiTokens {
      fullAccess {
        token = "<CHANGE THIS>"
        token = ${?API_FULL_ACCESS_TOKEN}
        description = "API Token Full Access User"
      }
    }
  }

  sessions {
    # Cache implementation: "memory", "database", or "hybrid"
    cache-type = "memory"
    cache-type = ${?SESSION_CACHE_TYPE}

    # UI Session TTL in hours (web browser sessions)
    ui-ttl-hours = 24
    ui-ttl-hours = ${?SESSION_UI_TTL_HOURS}

    # CLI Session TTL in hours (command-line sessions)
    cli-ttl-hours = 168  # 7 days
    cli-ttl-hours = ${?SESSION_CLI_TTL_HOURS}

    # Deprecated: kept for backwards compatibility, defaults to UI TTL
    ttl-hours = 24
    ttl-hours = ${?SESSION_TTL_HOURS}

    # Cleanup interval in minutes (for database cache)
    cleanup-interval-minutes = 60
    cleanup-interval-minutes = ${?SESSION_CLEANUP_INTERVAL_MINUTES}

    # Max sessions per user (for database/hybrid cache)
    max-sessions-per-user = 5
    max-sessions-per-user = ${?MAX_SESSIONS_PER_USER}
    
    # Memory cache settings
    memory {
      # Maximum number of sessions to keep in memory
      max-size = 1000
      max-size = ${?SESSION_MEMORY_MAX_SIZE}
    }
    
    # L1 cache settings (for database cache)
    l1-cache {
      # Maximum size of L1 cache
      max-size = 1000
      max-size = ${?SESSION_L1_CACHE_MAX_SIZE}
      
      # TTL for L1 cache entries in minutes
      ttl-minutes = 60
      ttl-minutes = ${?SESSION_L1_CACHE_TTL_MINUTES}
    }
    
    # Hybrid cache settings
    hybrid {
      # Warm up cache on startup
      warm-up-on-start = false
      warm-up-on-start = ${?SESSION_HYBRID_WARM_UP_ON_START}
      
      # Number of sessions to warm up
      warm-up-limit = 100
      warm-up-limit = ${?SESSION_HYBRID_WARM_UP_LIMIT}
    }
  }

}


pekko {
  loggers = ["org.apache.pekko.event.slf4j.Slf4jLogger"]
  loglevel = "DEBUG"
  log-dead-letters = off
  log-dead-letters-during-shutdown = on

  actor {
    debug {
      lifecycle = off
      unhandled = off
    }
  }

  http {
    client {
      parsing {
        illegal-header-warnings = off
      }
    }

    server {
      parsing {
        illegal-header-warnings = off
      }
    }
  }
}


postgres {
  dataSourceClassName = org.postgresql.ds.PGSimpleDataSource
  dataSource {
    user = postgres
    user = ${?DB_USER}
    password = "app_db_pass"
    password = ${?DB_PASSWORD}
    databaseName = app_db
    databaseName = ${?DB_NAME}
    portNumber = 5432
    portNumber = ${?DB_PORT}
    serverName = localhost
    serverName = ${?DB_HOST}
  }
  connectionTimeout = 30000
}

# Kamon monitorization
kamon {
  influxdb {
    hostname = "localhost"
    port = 8086

    database = "escalatorstarter"

    hostname-override = "development"
  }
}