# ============================================================================
# Escalator Starter - Docker Compose
# ============================================================================
# For Coolify: Database is managed separately via Coolify DB resource
# For local dev: Use compose.local.yaml override to add a local db service
# ============================================================================

services:
  # --------------------------------------------------------------------------
  # Nginx - Entry point (serves static files + proxies to backend)
  # --------------------------------------------------------------------------
  nginx:
    build:
      context: .
      dockerfile: Dockerfile
      target: nginx
    # Don't bind host ports - Coolify/Traefik handles external routing
    # Domain is configured in Coolify UI (Domains for nginx)
    expose:
      - "80"
    depends_on:
      app:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost/nginx-health"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3
    restart: unless-stopped

  # --------------------------------------------------------------------------
  # Application Backend
  # --------------------------------------------------------------------------
  app:
    build:
      context: .
      dockerfile: Dockerfile
      target: runtime
    # No external port - only accessible via nginx
    expose:
      - "30099"
    environment:
      # Database connection - set via Coolify env vars
      - DB_HOST=${DB_HOST}
      - DB_PORT=${DB_PORT:-5432}
      - DB_USER=${DB_USER}
      - DB_PASSWORD=${DB_PASSWORD}
      - DB_NAME=${DB_NAME}
      
      # Authentication
      - AUTH_PEPPER=${AUTH_PEPPER}
      - API_FULL_ACCESS_TOKEN=${API_FULL_ACCESS_TOKEN:-}
      
      # Session management
      - SESSION_CACHE_TYPE=${SESSION_CACHE_TYPE:-hybrid}
      
      # JVM options
      - JAVA_OPTS=${JAVA_OPTS:--Xmx512m -Xms256m}
    healthcheck:
      test: ["CMD", "curl", "-s", "-o", "/dev/null", "-w", "%{http_code}", "http://localhost:30099/"]
      interval: 30s
      timeout: 10s
      start_period: 60s
      retries: 3
    restart: unless-stopped

